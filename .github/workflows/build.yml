name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Build APK
        run: |
          flutter create build_temp
          cp pubspec.yaml build_temp/
          cp lib/main.dart build_temp/lib/
          cd build_temp
          flutter pub get
          flutter build apk --release
          
      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-app-apk
          path: build_temp/build/app/outputs/flutter-apk/app-release.apk
