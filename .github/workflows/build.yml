name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 1. 让服务器建一个全新的、标准的安卓工程（彻底避免冲突）
      - name: Create clean Flutter project
        run: flutter create build_temp --project-name cabinet_app

      # 2. 把我们写好的代码拷进新工程
      - name: Copy source files
        run: |
          cp pubspec.yaml build_temp/
          cp lib/main.dart build_temp/lib/

      # 3. 编译打包
      - name: Build release APK
        run: |
          cd build_temp
          flutter pub get
          flutter build apk --release

      # 4. 把成品拿出来
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-app-apk
          path: build_temp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
