name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create clean Flutter project
        run: flutter create build_temp --project-name cabinet_app

      - name: Copy source files
        run: |
          cp pubspec.yaml build_temp/
          cp lib/main.dart build_temp/lib/

      - name: Set compatible toolchain versions
        run: |
          cd build_temp
          # 指定 Flutter 3.24 兼容的 Gradle 版本
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
          # 更新 AGP 和 Kotlin 版本
          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.5.0"/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.10"/' android/settings.gradle
          
          # 确保 compileSdk 为 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle

      - name: Clean and Build release APK
        run: |
          cd build_temp
          flutter clean
          flutter pub get
          flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-app-apk
          path: build_temp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
